/* Painel de acessibilidade */
#acessibilidade{
    position: fixed;
    top: 100px;
    right: 20px;
    z-index: 9999;

    display: flex;
    flex-direction: column;
    gap: 10px;
}

#acessibilidade button{
    width: 55px;
    height: 55px;

    border: none;
    border-radius: 12px;

    background: #2957A4;
    color: white;

    font-weight: bold;
    font-size: 16px;

    box-shadow: 0 4px 10px rgba(0,0,0,.2);

    transition: .3s;
}

#acessibilidade button:hover{
    transform: scale(1.08);
    background:#5780c7;
}

/* Alto contraste */
body.alto-contraste,
body.alto-contraste * {
    background-color: #000 !important;
    color: #fff !important;
    border-color: #fff !important;
    box-shadow: none !important;
}

/* Links */
body.alto-contraste a,
body.alto-contraste a:visited {
    color: #ffff00 !important;
    text-decoration: underline !important;
}

/* Botões */
body.alto-contraste button,
body.alto-contraste .btn,
body.alto-contraste .custom-btn,
body.alto-contraste input[type="submit"] {
    background: #ffff00 !important;
    color: #000 !important;
    border: 2px solid #fff !important;
}

/* Campos de formulário */
body.alto-contraste input,
body.alto-contraste textarea,
body.alto-contraste select {
    background: #000 !important;
    color: #fff !important;
    border: 2px solid #fff !important;
}

/* Imagens permanecem normais */
body.alto-contraste img,
body.alto-contraste video,
body.alto-contraste svg {
    background: transparent !important;
}

/* Tabelas */
body.alto-contraste table,
body.alto-contraste th,
body.alto-contraste td {
    border: 1px solid #fff !important;
    color: #fff !important;
}

    <script>
        (() => {
        'use strict'


        const forms = document.querySelectorAll('.needs-validation')


        // Loop over them and prevent submission
        Array.from(forms).forEach(form => {
        form.addEventListener('submit', event => {

            event.preventDefault(); // impede o recarregamento

            if (!form.checkValidity()) {
                event.stopPropagation();
            }else{
                const nome = document.getElementById("nome").value;

                Swal.fire({
                    title: ' Bem-vindo(a)!',
                    html: `
                        <p>Olá, <strong>${nome}</strong>!</p>
                        <p>Seu cadastro foi realizado com sucesso.</p>
                    `,
                    icon: 'success',
                    confirmButtonColor: '#2957A4',
                    confirmButtonText: 'Continuar'
                });
            }
           
            form.classList.add('was-validated')
            }, false)
           
        })
        })()


        // Validação
        const telefoneInput = document.getElementById("telefone");


        //Máscara do Telefone
        telefoneInput.addEventListener("input", function(){
            let telefone = telefoneInput.value.replace(/\D/g, "");


            if(telefone.length > 2 && telefone.length <=7){
                telefone = "(" + telefone.slice(0,2) + ") " + telefone.slice(2);
            }
            else if(telefone.length > 7){
                telefone = "(" + telefone.slice(0,2) + ") " + telefone.slice(2,7) + "-" + telefone.slice(7,11);
            }
            telefoneInput.value = telefone;
        });
        </script>

        <script>
let tamanhoFonte = 0;

function alterarFonte(valor) {

    tamanhoFonte += valor * 1;

    if (tamanhoFonte < -2) tamanhoFonte = -2;
    if (tamanhoFonte > 3) tamanhoFonte = 3;

    // pega TODOS os elementos visíveis com texto
    const elementos = document.querySelectorAll("body *");

    elementos.forEach(el => {

        // ignora elementos vazios ou não textuais
        if (el.children.length === 0 && el.innerText.trim() !== "") {

            const estilo = window.getComputedStyle(el);
            let fontSize = parseFloat(estilo.fontSize);

            // se não tiver tamanho definido, assume 16px
            if (!fontSize) fontSize = 16;

            // aplica incremento
            const novoTamanho = fontSize + (valor * 2);

            // limites de segurança
            if (novoTamanho >= 10 && novoTamanho <= 40) {
                el.style.fontSize = novoTamanho + "px";
            }
        }
    });
}

function toggleContraste() {
    document.body.classList.toggle("alto-contraste");
}
</script>
